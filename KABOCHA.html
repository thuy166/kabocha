ji:"🍊",days:"3 ngày"},{id:4,name:"Gyeongju",englishName:"경주",region:"Miền Đông",category:"Văn hóa",description:"Ở Gyeongju, di tích lịch sử nằm giữa nhịp sống bình dị và những khoảng xanh rộng mở. Hãy dành thời gian ghé khu lăng mộ Daereungwon, ngắm đèn phản chiếu ở Donggung và Wolji khi trời tối, rồi thong thả đạp xe qua những con đường rợp bóng cây.",imageUrl:"https://images.unsplash.com/photo-1609766418204-94wek8f38e9?auto=format&fit=crop&w=1000&q=85",emoji:"🏯",days:"1–2 ngày"},{id:5,name:"Incheon",englishName:"인천",region:"Miền Tây",category:"Ẩm thực",description:"Incheon không chỉ là điểm dừng chân trên đường từ sân bay vào Seoul. Phố Tàu, những khu phố cũ và bờ cảng tạo nên một ngày khám phá vừa rộn ràng vừa thư thả; nhớ để bụng cho vài món ăn vặt trước khi ngắm hoàng hôn bên biển.",imageUrl:"https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1000&q=85",emoji:"🥟",days:"1 ngày"},{id:6,name:"Gangneung",englishName:"강릉",region:"Miền Đông",category:"Biển",description:"Gangneung là lựa chọn dịu dàng cho một kỳ nghỉ sát biển. Bắt đầu ngày mới bằng cà phê ở Anmok, đi dạo gần hồ Gyeongpo và để tiếng sóng bờ Đông làm nền cho một buổi chiều thật chậm.",imageUrl:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1000&q=85",emoji:"☕",days:"1–2 ngày"},{id:7,name:"Sokcho",englishName:"속초",region:"Gangwon",category:"Thiên nhiên",description:"Sokcho nằm giữa núi Seorak và biển, nên một ngày ở đây có thể bắt đầu bằng đường mòn xanh mát và kết thúc bên bến cá. Ghé chợ trung tâm để thử món địa phương, rồi đi dạo bờ biển khi trời chuyển màu.",imageUrl:"https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1000&q=85",emoji:"⛰️",days:"1–2 ngày"},{id:8,name:"Jeonju",englishName:"전주",region:"Miền Tây",category:"Ẩm thực",description:"Jeonju quyến rũ bằng những mái hanok nối nhau và mùi thơm lan ra từ các quán ăn gia đình. Hãy thong thả dạo làng cổ, ghé một tiệm trà truyền thống và thưởng thức bibimbap — món ăn đã làm nên tên tuổi của thành phố.",imageUrl:"https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=1000&q=85",emoji:"🍲",days:"1–2 ngày"},{id:9,name:"Andong",englishName:"안동",region:"Miền Đông",category:"Văn hóa",description:"Andong đưa bạn về một Hàn Quốc trầm lắng hơn, với làng Hahoe nép bên khúc sông và những ngôi nhà hanok được gìn giữ qua nhiều thế hệ. Đây là nơi hợp để dành một ngày đi bộ, tìm hiểu phong tục địa phương và thưởng thức món ăn truyền thống.",imageUrl:"https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=1000&q=85",emoji:"🏘️",days:"1 ngày"},{id:10,name:"Daegu",englishName:"대구",region:"Miền Nam",category:"Ẩm thực",description:"Daegu có những khu chợ náo nhiệt, phố cà phê dễ thương và nhiều món ăn cay ấm bụng. Dạo chợ Seomun để nếm thử đồ ăn địa phương, rồi lên đài quan sát Apsan khi muốn nhìn thành phố từ trên cao.",imageUrl:"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1000&q=85",emoji:"🍜",days:"1–2 ngày"},{id:11,name:"Yeosu",englishName:"여수",region:"Miền Nam",category:"Biển",description:"Yeosu đẹp nhất vào những giờ nắng dịu, khi mặt biển lấp lánh và các hòn đảo hiện ra ngoài khơi. Đi cáp treo qua vịnh, ghé đảo Odongdo hoặc đơn giản là chọn một chỗ ngồi ven bờ để thưởng thức hải sản và ngắm trời tối dần.",imageUrl:"https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=1000&q=85",emoji:"🌅",days:"1–2 ngày"},{id:12,name:"Tongyeong",englishName:"통영",region:"Miền Nam",category:"Thiên nhiên",description:"Tongyeong là thành phố cảng nhỏ với những con dốc nhìn ra biển và đảo xanh rải khắp đường chân trời. Ghé làng Dongpirang để xem tranh tường, đi cáp treo ngắm vịnh từ trên cao và dành thời gian cho một bữa hải sản tươi.",imageUrl:"https://images.unsplash.com/photo-1498307833015-e7b400441eb8?auto=format&fit=crop&w=1000&q=85",emoji:"⛵",days:"1–2 ngày"},{id:13,name:"Daejeon",englishName:"대전",region:"Miền Trung",category:"Văn hóa",description:"Daejeon là điểm dừng chân dễ chịu giữa những chặng tàu dài, với công viên rộng, bảo tàng khoa học và nhịp sống ít vội. Đừng quên ghé một tiệm bánh địa phương nổi tiếng để nạp năng lượng trước khi tiếp tục hành trình.",imageUrl:"https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1000&q=85",emoji:"🚄",days:"1 ngày"},{id:14,name:"Suwon",englishName:"수원",region:"Gyeonggi",category:"Văn hóa",description:"Suwon nổi bật với pháo đài Hwaseong, nơi bạn có thể đi bộ dọc tường thành và nhìn mái nhà trải dài phía dưới. Kết hợp chuyến tham quan với một bữa gà nướng kiểu Suwon để có một ngày vừa nhiều cảnh đẹp vừa no bụng.",imageUrl:"https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=1000&q=85",emoji:"🏰",days:"1 ngày"},{id:15,name:"Chuncheon",englishName:"춘천",region:"Gangwon",category:"Thiên nhiên",description:"Chuncheon được bao quanh bởi hồ và núi, thích hợp cho chuyến đi ngắn rời xa phố lớn. Thuê xe dạo quanh vùng hồ, ngắm cảnh đổi mùa và dành bữa trưa cho dakgalbi nóng hổi — món ăn gắn liền với thành phố.",imageUrl:"https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1000&q=85",emoji:"🏞️",days:"1–2 ngày"},{id:16,name:"Đảo Nami",englishName:"남이섬",region:"Gangwon",category:"Thiên nhiên",description:"Đảo Nami là nơi lý tưởng để đi bộ hoặc đạp xe dưới những hàng cây đổi sắc theo mùa. Qua một chuyến phà ngắn, bạn sẽ có cả ngày dạo quanh bờ hồ, dừng lại chụp ảnh và tận hưởng không khí trong lành.",imageUrl:"https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1000&q=85",emoji:"🍂",days:"1 ngày"},{id:17,name:"Paju",englishName:"파주",region:"Gyeonggi",category:"Văn hóa",description:"Paju mang một sắc thái khác hẳn trung tâm Seoul, với làng sách, không gian nghệ thuật và những điểm tham quan giàu lịch sử. Có thể ghé Heyri hoặc khu Imjingak trong chuyến đi trong ngày; nhớ xem trước giờ mở cửa và hướng dẫn tham quan khu DMZ.",imageUrl:"https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=1000&q=85",emoji:"📚",days:"1 ngày"},{id:18,name:"Pohang",englishName:"포항",region:"Miền Đông",category:"Biển",description:"Pohang là thành phố biển dành cho những buổi sáng dậy sớm và những bữa hải sản dài. Dạo quảng trường Homigot, ngắm đường bờ biển thoáng rộng rồi ghé Space Walk để nhìn thành phố và biển từ một góc thật khác.",imageUrl:"https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1000&q=85",emoji:"🌊",days:"1–2 ngày"},{id:19,name:"Ulsan",englishName:"울산",region:"Miền Đông",category:"Thiên nhiên",description:"Ulsan có những khoảng xanh bất ngờ bên cạnh thành phố công nghiệp: rừng tre Taehwagang, công viên ven biển và lối đi nhìn ra đại dương. Đây là điểm dừng hợp cho ai muốn kết hợp một ngày ở thành phố với những giờ đi bộ ngoài trời.",imageUrl:"https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1000&q=85",emoji:"🌿",days:"1 ngày"},{id:20,name:"Suncheon",englishName:"순천",region:"Miền Nam",category:"Thiên nhiên",description:"Suncheon nổi tiếng với những vùng đất ngập nước, thảm lau sậy và khu vườn rộng để thong thả dạo bộ. Hãy dành trọn một ngày cho thiên nhiên, đi ngắm chim và chờ ánh chiều phủ vàng lên đầm lầy.",imageUrl:"https://images.unsplash.com/photo-1476231682828-37e571bc172f?auto=format&fit=crop&w=1000&q=85",emoji:"🪷",days:"1–2 ngày"},{id:21,name:"Mokpo",englishName:"목포",region:"Miền Nam",category:"Ẩm thực",description:"Mokpo có vẻ đẹp của một thành phố cảng lâu đời, với phố cũ, bảo tàng và đường chân trời nhìn từ cáp treo biển. Sau buổi dạo chơi, hãy thử các món ăn vùng Jeolla vốn nổi tiếng bởi hương vị đậm đà và nhiều lựa chọn hải sản.",imageUrl:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=85",emoji:"🚠",days:"1 ngày"},{id:22,name:"Geoje",englishName:"거제",region:"Miền Nam",category:"Biển",description:"Geoje có những vịnh nước xanh, vách đá hướng ra biển và các chuyến phà đưa bạn đến đảo nhỏ quanh vùng. Hãy đi chậm qua những cung đường ven bờ, dừng ở điểm ngắm cảnh và tận hưởng một ngày mặn vị gió biển.",imageUrl:"https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1000&q=85",emoji:"🛥️",days:"1–2 ngày"},{id:23,name:"Đảo Udo",englishName:"우도",region:"Đảo Jeju",category:"Biển",description:"Udo là hòn đảo nhỏ ngoài khơi Jeju, nơi một vòng xe đạp có thể đưa bạn qua bãi biển, làng chài và những góc ngắm biển xanh. Dừng lại thử kem đậu phộng địa phương rồi chọn một bãi cát để nghỉ chân.",imageUrl:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1000&q=85",emoji:"🥜",days:"1 ngày"},{id:24,name:"Seogwipo",englishName:"서귀포",region:"Đảo Jeju",category:"Thiên nhiên",description:"Seogwipo đưa bạn đến phía Nam Jeju, nơi có thác nước đổ gần biển, vách đá núi lửa và những lối đi ven bờ. Đây cũng là điểm dừng thuận tiện để khám phá các cung đường Olle và những ngôi làng yên bình.",imageUrl:"https://images.unsplash.com/photo-1473116763249-2faaef81ccda?auto=format&fit=crop&w=1000&q=85",emoji:"💧",days:"1–2 ngày"},{id:25,name:"Seongsan",englishName:"성산일출봉",region:"Đảo Jeju",category:"Thiên nhiên",description:"Seongsan Ilchulbong là miệng núi lửa hướng ra biển, đặc biệt đẹp vào buổi sớm khi ánh bình minh dần hiện trên đảo. Đường lên đỉnh có bậc thang và điểm dừng ngắm cảnh, rất đáng để dành nửa ngày khám phá.",imageUrl:"https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1000&q=85",emoji:"🌋",days:"Nửa ngày"},{id:26,name:"Myeongdong",englishName:"명동",region:"Seoul",category:"Ẩm thực",description:"Myeongdong là khu phố dành cho một buổi chiều đi bộ, mua sắm và thử món ăn đường phố. Các quầy đồ ăn bắt đầu đông vui hơn về chiều tối, còn những con phố bên cạnh có đủ cửa hàng mỹ phẩm và quán ăn để bạn nán lại.",imageUrl:"https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1000&q=85",emoji:"🛍️",days:"Nửa ngày"},{id:27,name:"Hongdae",englishName:"홍대",region:"Seoul",category:"Văn hóa",description:"Hongdae trẻ trung, nhiều màu sắc và luôn có điều gì đó diễn ra trên phố. Ghé các cửa hàng độc lập, ngồi ở một quán cà phê cá tính rồi dạo quanh để bắt gặp nhạc sống và những màn biểu diễn đường phố.",imageUrl:"https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1000&q=85",emoji:"🎸",days:"Nửa ngày"},{id:28,name:"Buyeo",englishName:"부여",region:"Miền Trung",category:"Văn hóa",description:"Buyeo lưu giữ dấu tích của vương quốc Baekje trong khung cảnh yên bình bên sông. Ghé pháo đài Busosanseong, khu di tích Baekje và hồ Gungnamji để có một ngày tìm hiểu lịch sử mà không cần vội vã.",imageUrl:"https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1000&q=85",emoji:"🏺",days:"1 ngày"},{id:29,name:"Boseong",englishName:"보성",region:"Miền Nam",category:"Thiên nhiên",description:"Boseong mở ra những đồi trà xanh uốn theo triền núi, mát lành và rất khác nhịp phố thị. Đi dạo giữa các luống trà, thưởng thức một tách trà địa phương rồi ghé những quán nhỏ quanh vùng để nghỉ chân.",imageUrl:"https://images.unsplash.com/photo-1523920290228-4f321a939b4c?auto=format&fit=crop&w=1000&q=85",emoji:"🍵",days:"1 ngày"}],Ci={1:{stayArea:"Myeongdong, City Hall hoặc Hongdae",localFood:["Gà hầm sâm","Canh mì kalguksu","Thịt nướng Hàn Quốc"],transit:"Tàu điện ngầm và xe buýt phủ khắp thành phố. Thẻ T-money giúp bạn chuyển tuyến thuận tiện."},2:{stayArea:"Seomyeon hoặc Haeundae",localFood:["Mì lạnh milmyeon","Canh thịt heo dwaeji-gukbap","Hải sản ở Jagalchi"],transit:"Tàu điện ngầm tiện cho các tuyến chính; xe buýt hữu ích khi đến bãi biển và làng ven đồi."},3:{stayArea:"Jeju City ở phía Bắc hoặc Seogwipo ở phía Nam",localFood:["Thịt heo đen Jeju","Cháo bào ngư","Trà và quýt Hallabong"],transit:"Xe buýt nối các khu vực chính nhưng thời gian di chuyển khá dài. Thuê xe hoặc đi taxi sẽ linh hoạt hơn cho lịch trình nhiều điểm."},4:{stayArea:"Hwangnidan-gil hoặc
